  const onglets=document.getElementById('onglets'),fiches=document.getElementById('fiches');

  function noeud(tag,classe,texte){const n=document.createElement(tag);if(classe)n.className=classe;if(texte!==undefined)n.textContent=texte;return n;}
  function compte(p){const n=p.etapes.length,f=p.etapes.filter(e=>e.ok).length;return {n,f,fini:n>0&&f===n,pct:n?Math.round(100*f/n):0};}
  function valide(d){
    if(!d||!Array.isArray(d.projets))return false;
    const ids=new Set();return d.projets.every(p=>{
      if(!p||typeof p.id!=='string'||!p.id||ids.has(p.id)||typeof p.nom!=='string'||!p.nom.trim()||typeof p.idee!=='string'||!Array.isArray(p.etapes))return false;

  function realisations(p,libelles){return p.etapes.flatMap(e=>{const t=libelles.get(e.t.replace(/'/g,'’'));return e.ok&&t?[{t,ok:true}]:[];});}
  function presentation(p,s){
    if(p.id==='sites'){
      const question=/veille des deux bulletins.+octobre/i.test(p.ouvert||'');
      return {idee:'Des publications consacrées aux projets, à la veille et aux synthèses de recherche.',reperes:question?[['Question ouverte','Actualiser la veille des deux bulletins ou conserver celle d’octobre ?']]:[],liste:'Réalisations',etapes:realisations(p,resultatsSites)};
    }
    if(p.id==='ia-decouverte')return {idee:'Découvrir les logiciels d’intelligence artificielle et comparer leurs usages au quotidien.',reperes:[['Critères de comparaison','La qualité des réponses, le temps nécessaire et les limites rencontrées sur des tâches concrètes.']],liste:'Travail réalisé',etapes:realisations(p,resultatsLogiciels)};

  }
  function panneau(p){

    const av=noeud('div','avancement'),comp=noeud('div','compte');comp.append(noeud('b',null,s.f+' / '+s.n+' étapes'),noeud('span',null,s.pct+' %'));const jauge=noeud('div','jauge');jauge.setAttribute('aria-hidden','true');const i=noeud('i');i.style.width=s.pct+'%';jauge.append(i);av.append(comp,jauge);intro.append(av);haut.append(intro);

  function projetDuFragment(){if(!location.hash.startsWith('#proj-'))return null;try{return decodeURIComponent(location.hash.slice(6));}catch(e){return null;}}

  }
  function construire(){

  construire();
  async function lireProjets(){try{const r=await fetch('projets.json?v='+Date.now(),{cache:'no-store',credentials:'omit',redirect:'error'});if(!r.ok)return;const d=await r.json();if(valide(d)&&JSON.stringify(d.projets)!==JSON.stringify(donnees.projets)){donnees=d;construire();}}catch(e){/* La copie intégrée reste utilisable. */}}

})();
